name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Abahgithub
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Add calendar month and weekday labels
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          // The contribution grid is 53 columns wide, with 16px between cells.
          // Its first column starts on the Sunday 52 weeks before the current week.
          const today = new Date();
          today.setUTCHours(0, 0, 0, 0);

          const currentSunday = new Date(today);
          currentSunday.setUTCDate(today.getUTCDate() - today.getUTCDay());

          const firstSunday = new Date(currentSunday);
          firstSunday.setUTCDate(currentSunday.getUTCDate() - 52 * 7);

          const monthFormatter = new Intl.DateTimeFormat("en", {
            month: "short",
            timeZone: "UTC"
          });

          const labels = [];
          const firstMonth = new Date(Date.UTC(
            firstSunday.getUTCFullYear(),
            firstSunday.getUTCMonth(),
            1
          ));

          for (let offset = 0; offset < 13; offset++) {
            const monthStart = new Date(Date.UTC(
              firstMonth.getUTCFullYear(),
              firstMonth.getUTCMonth() + offset,
              1
            ));

            if (monthStart > today) break;

            // If the first month began before the visible grid, anchor it to column 0.
            const visibleDate = monthStart < firstSunday ? firstSunday : monthStart;
            const daysFromStart = Math.floor((visibleDate - firstSunday) / 86400000);
            const weekColumn = Math.floor(daysFromStart / 7);
            const x = 2 + weekColumn * 16;

            labels.push(
              '<text x="' + x + '" y="-12" fill="#8b949e" font-size="10" font-family="Arial, sans-serif">' +
              monthFormatter.format(monthStart) +
              '</text>'
            );
          }

          // GitHub contribution rows are Sunday through Saturday.
          // Label Monday, Wednesday and Friday, aligned with their row centers.
          for (const day of [
            { label: "Mon", y: 29 },
            { label: "Wed", y: 61 },
            { label: "Fri", y: 93 }
          ]) {
            labels.push(
              '<text x="-5" y="' + day.y + '" text-anchor="end" fill="#8b949e" font-size="9" font-family="Arial, sans-serif">' +
              day.label +
              '</text>'
            );
          }

          for (const file of [
            "dist/github-contribution-grid-snake.svg",
            "dist/github-contribution-grid-snake-dark.svg"
          ]) {
            let svg = fs.readFileSync(file, "utf8");
            if (!svg.includes('class="calendar-labels"')) {
              svg = svg.replace(
                "</svg>",
                '<g class="calendar-labels">' + labels.join("") + "</g></svg>"
              );
            }
            fs.writeFileSync(file, svg);
          }
          NODE

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
