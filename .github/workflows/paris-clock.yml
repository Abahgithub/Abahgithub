name: Update Paris Liquid Glass clock

on:
  # Décalage de 2 minutes pour éviter le pic de charge à chaque heure.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/paris-clock.yml"
      - "scripts/generate_paris_clock.py"
      - "README.md"

permissions:
  contents: write

# Évite deux exécutions simultanées qui pourraient se gêner lors du push.
concurrency:
  group: paris-clock-update
  cancel-in-progress: true

jobs:
  update-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate clock SVG
        run: python scripts/generate_paris_clock.py

      - name: Commit updated clock
        run: |
          if git diff --quiet -- assets/paris-clock.svg; then
            echo "Clock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/paris-clock.svg
          git commit -m "Update Paris Liquid Glass clock"
          git push
