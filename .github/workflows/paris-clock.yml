name: Update Paris Liquid Glass clock

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate clock SVG
        run: python scripts/generate_paris_clock.py

      - name: Commit updated clock
        run: |
          if git diff --quiet -- assets/paris-clock.svg; then
            echo "Clock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/paris-clock.svg
          git commit -m "Update Paris Liquid Glass clock"
          git push
